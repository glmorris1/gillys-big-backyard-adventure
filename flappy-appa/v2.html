<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Appa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", monospace;
      font-weight: bold;
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }
    .splash {
      text-align: center;
      background: #111;
      padding: 40px;
      border: 8px solid #333;
      border-radius: 8px;
      max-width: 380px;
      cursor: pointer;
    }
    .splash h1 {
      font-size: 42px;
      margin: 0 0 8px;
      text-shadow: 3px 3px 0 #000;
    }
    .splash .yip {
      font-size: 14px;
      color: #ffcc66;
      margin-bottom: 20px;
    }
    .splash button {
      background: #c33;
      color: #fff;
      border: 6px solid #111;
      font-size: 20px;
      padding: 12px 50px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      margin: 10px 0 20px;
      box-shadow: 0 6px 0 #111;
    }
    .splash button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #111;
    }
    .container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 8px solid #111;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .info {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash" class="splash" onclick="startGame()">
    <h1>FLAPPY<br>APPA</h1>
    <div class="yip">YIP YIP!</div>
    
    <div style="font-size: 60px; margin: 10px 0;">🦬</div>
    
    <button onclick="event.stopImmediatePropagation(); startGame();">PLAY</button>
    
    <div style="font-size: 10px; line-height: 1.5; color: #aaa;">
      CLICK / TAP / SPACE TO FLAP<br>
      AVOID THE ROCK SPIRES AND FIREBALLS
    </div>
    
    <div id="best" style="margin-top: 18px; font-size: 11px; color: #666;">
      BEST: <span>0</span>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-container" class="container" style="display: none;">
    <canvas id="game" width="320" height="512"></canvas>
  </div>

    // ==================== AUDIO ====================
    let audio;
    function beep(type) {
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.connect(g); g.connect(audio.destination);

        if (type === 'flap') {
          o.type = 'sawtooth'; o.frequency.value = 380; g.gain.value = 0.12;
          g.gain.linearRampToValueAtTime(0.001, audio.currentTime + 0.18);
          o.start(); o.stop(audio.currentTime + 0.2);
        } else if (type === 'score') {
          o.type = 'square'; o.frequency.value = 780; g.gain.value = 0.15;
          g.gain.linearRampToValueAtTime(0.001, audio.currentTime + 0.25);
          o.start(); o.stop(audio.currentTime + 0.26);
        } else if (type === 'fire') {
          o.type = 'sawtooth'; o.frequency.value = 140; g.gain.value = 0.08;
          g.gain.linearRampToValueAtTime(0.001, audio.currentTime + 0.3);
          o.start(); o.stop(audio.currentTime + 0.32);
        } else if (type === 'hit') {
          o.type = 'sine'; o.frequency.value = 90; g.gain.value = 0.3;
          g.gain.linearRampToValueAtTime(0.001, audio.currentTime + 0.5);
          o.start(); o.stop(audio.currentTime + 0.55);
        }
      } catch(e){}
    }

    // ==================== RESET ====================
    function reset() {
      appa = { x: 70, y: 210, vy: 0, rot: 0 };
      pillars = [];
      firebenders = [];
      fireballs = [];
      score = 0;
      frame = 0;
      flapAnim = 0;
      state = 'play';

      // initial pillars
      pillars.push({ x: 280, gapY: 160, passed: false });
      pillars.push({ x: 460, gapY: 205, passed: false });
    }

    // ==================== UPDATE ====================
    function update() {
      if (state !== 'play') return;

      frame++;
      flapAnim = Math.max(0, flapAnim - 1);

      // Appa physics
      appa.vy += GRAVITY;
      appa.y += appa.vy;
      appa.rot = Math.max(-0.6, Math.min(1.3, appa.vy * 0.065));

      // Pillar scrolling + spawning
      for (let p of pillars) p.x -= SCROLL;

      if (pillars.length === 0 || pillars[pillars.length-1].x < 120) {
        const gy = 90 + Math.random() * 220;
        pillars.push({ x: W + 30, gapY: gy, passed: false });
      }
      pillars = pillars.filter(p => p.x > -60);

      // Score
      for (let p of pillars) {
        if (!p.passed && p.x + 40 < appa.x) {
          p.passed = true;
          score++;
          beep('score');
        }
      }

      // Firebenders - intermittent, high random jumps, one fireball
      if (frame % 95 === 0 && firebenders.length < 2 && Math.random() < 0.85) {
        firebenders.push({
          x: W + 20,
          baseY: GROUND_Y - 8,
          phase: 0,
          jumpH: 80 + Math.random() * 300,
          shot: false
        });
      }

      for (let fb of firebenders) {
        fb.x -= SCROLL * 0.9;

        if (fb.phase === 0 && fb.x < W * 0.75) {
          fb.phase = 0.01;
        }

        if (fb.phase > 0) {
          fb.phase += 0.038;
          const cy = fb.baseY - Math.sin(fb.phase * Math.PI) * fb.jumpH;

          if (!fb.shot && fb.phase > 0.35 && fb.phase < 0.65) {
            fireballs.push({ x: fb.x + 10, y: cy - 10, vx: -3.6 });
            fb.shot = true;
            beep('fire');
          }

          fb.cy = cy;
          if (fb.phase > 1) fb.phase = 1;
        }
      }
      firebenders = firebenders.filter(f => f.x > -50);

      for (let f of fireballs) f.x += f.vx;
      fireballs = fireballs.filter(f => f.x > -20);

      if (appa.y < 12 || appa.y > GROUND_Y - 8) {
        die();
        return;
      }

      for (let p of pillars) {
        const inX = appa.x > p.x - 10 && appa.x < p.x + 50;
        if (inX && (appa.y < p.gapY - 8 || appa.y > p.gapY + 128 + 8)) {
          die();
          return;
        }
      }

      for (let f of fireballs) {
        const dx = appa.x - f.x;
        const dy = appa.y - f.y;
        if (dx*dx + dy*dy < 220) {
          die();
          return;
        }
      }
    }

    function die() {
      if (state !== 'play') return;
      state = 'over';
      beep('hit');
      if (score > best) {
        best = score;
        localStorage.setItem('flappyAppaBest', best);
      }
    }

    // ==================== DRAW ====================
    function draw() {
      ctx.fillStyle = '#7fc4e8';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#3a5a3a';
      ctx.beginPath();
      ctx.moveTo(0, 310);
      ctx.lineTo(40, 240); ctx.lineTo(85, 290); ctx.lineTo(140, 235);
      ctx.lineTo(190, 295); ctx.lineTo(250, 225); ctx.lineTo(295, 280);
      ctx.lineTo(320, 240); ctx.lineTo(320, 340); ctx.lineTo(0, 340);
      ctx.fill();

      ctx.fillStyle = '#5c7a5c';
      ctx.beginPath();
      ctx.moveTo(0, 300);
      ctx.lineTo(55, 215); ctx.lineTo(105, 265); ctx.lineTo(165, 195);
      ctx.lineTo(225, 270); ctx.lineTo(280, 205); ctx.lineTo(320, 255);
      ctx.lineTo(320, 320); ctx.lineTo(0, 320);

      ctx.fillStyle = '#4a6a4a';

      ctx.lineTo(320, 310); ctx.lineTo(0, 310);

      ctx.beginPath(); ctx.arc(88 - cloudX * 0.3, 82, 13, 0, Math.PI*2); ctx.fill();

        for (let i = 1; i < 6; i++) {
          const ly = (p.gapY / 6) * i;

          if (i % 2 === 0) ctx.fillRect(px + 1, ly + 1, 3, 2);
        }
        ctx.fillStyle = '#3a2a22';
        ctx.beginPath();
        ctx.moveTo(px - 2, p.gapY);
        ctx.lineTo(px + 5, p.gapY - 14);
        ctx.lineTo(px + 15, p.gapY - 9);
        ctx.lineTo(px + 25, p.gapY - 16);
        ctx.lineTo(px + 35, p.gapY - 8);
        ctx.lineTo(px + pw + 3, p.gapY - 13);
        ctx.lineTo(px + pw + 2, p.gapY);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#2a2218';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px + 9, 10); ctx.lineTo(px + 11, p.gapY - 5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px + pw - 12, 15); ctx.lineTo(px + pw - 8, p.gapY - 10); ctx.stroke();

        const by = p.gapY + 128;
        ctx.fillStyle = '#5c4a3a';
        ctx.fillRect(px, by, pw, H - by);
        ctx.fillStyle = '#4a3a2a';
        for (let i = 1; i < 5; i++) {
          const ly = by + ((H - by) / 5) * i;
          ctx.fillRect(px + 2, ly - 1, pw - 4, 3);
        }
        ctx.fillStyle = '#3a2a22';
        ctx.beginPath();
        ctx.moveTo(px - 2, by);
        ctx.lineTo(px + 4, by + 12);
        ctx.lineTo(px + 18, by + 8);
        ctx.lineTo(px + 28, by + 15);
        ctx.lineTo(px + 38, by + 7);
        ctx.lineTo(px + pw + 2, by + 11);
        ctx.lineTo(px + pw + 2, by);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#2a2218';
        ctx.beginPath(); ctx.moveTo(px + 10, by + 5); ctx.lineTo(px + 8, H - 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px + pw - 11, by + 10); ctx.lineTo(px + pw - 13, H - 5); ctx.stroke();
      }

      ctx.fillStyle = '#9c2a1f';
      for (let fb of firebenders) {
        const y = fb.cy || fb.baseY;
        ctx.fillRect(fb.x - 5, y - 12, 12, 14);
        ctx.fillStyle = '#222';
        ctx.fillRect(fb.x - 3, y - 20, 8, 8);
        ctx.fillStyle = '#9c2a1f';
        if (fb.phase > 0.2 && fb.phase < 0.8) ctx.fillRect(fb.x + 6, y - 16, 3, 8);
      }

      for (let f of fireballs) {
        ctx.fillStyle = '#ff5500';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffee44';
        ctx.beginPath();
        ctx.arc(f.x - 1, f.y - 1, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(appa.x, appa.y);
      ctx.rotate(appa.rot);

      if (spriteReady) {
        const sw = 64;
        const sh = 43;
        ctx.drawImage(appaSprite, -sw/2, -sh/2, sw, sh);
      } else {
        ctx.fillStyle = '#f5f0e0';
        ctx.fillRect(-20, -6, 38, 18);
        ctx.fillStyle = '#8b6f47';
        ctx.fillRect(-12, -5, 20, 8);
        ctx.fillRect(-8, -10, 12, 5);
        ctx.fillStyle = '#f5f0e0';
        ctx.beginPath();
        ctx.arc(13, 0, 10, -0.3, Math.PI * 1.6);
        ctx.fill();
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.moveTo(8, -8); ctx.lineTo(3, -14); ctx.lineTo(9, -9); ctx.fill();
        ctx.beginPath(); ctx.moveTo(17, -8); ctx.lineTo(22, -14); ctx.lineTo(17, -9); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.fillRect(8, -2, 3, 2);
        ctx.fillRect(15, -2, 3, 2);
        ctx.fillStyle = '#c5a37a';
        ctx.fillRect(20, -1, 6, 4);
        ctx.fillStyle = '#333';
        ctx.fillRect(24, 0, 2, 2);
        ctx.fillStyle = '#8b6f47';
        ctx.fillRect(-14, 8, 5, 7);
        ctx.fillRect(-4, 8, 5, 7);
        ctx.fillRect(6, 8, 5, 7);
        ctx.fillRect(15, 8, 5, 7);
        ctx.fillStyle = '#333';
        ctx.fillRect(-14, 13, 5, 3);
        ctx.fillRect(-4, 13, 5, 3);
        ctx.fillRect(6, 13, 5, 3);
        ctx.fillRect(15, 13, 5, 3);
        ctx.fillStyle = '#f5f0e0';
        ctx.fillRect(-24, -2, 8, 8);
        ctx.fillStyle = '#8b6f47';
        ctx.fillRect(-26, 2, 4, 4);
      }
      ctx.restore();

      ctx.fillStyle = '#6b5a3a';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      ctx.fillStyle = '#4a3a22';
      ctx.fillRect(0, GROUND_Y + 8, W, 12);
      ctx.fillStyle = '#3a2a1a';
      const rockOffset = (frame * 0.6) % 40;
      for (let i = 0; i < 9; i++) {
        const rx = (i * 42 - rockOffset) % (W + 50) - 20;
        ctx.fillRect(rx, GROUND_Y + 14 + (i % 3) * 3, 7 + (i % 3), 4);
        ctx.fillRect(rx + 18, GROUND_Y + 19, 4, 3);
      }
      ctx.fillStyle = '#4a6a3a';
      ctx.fillRect(0, GROUND_Y, W, 8);
      ctx.strokeStyle = '#3a5a2a';
      ctx.lineWidth = 2;
      const grassOffset = (frame * 0.9) % 30;
      for (let i = -2; i < 14; i++) {
        const gx = (i * 28 - grassOffset) % (W + 40) - 15;
        ctx.beginPath(); ctx.moveTo(gx, GROUND_Y + 2); ctx.lineTo(gx + 4, GROUND_Y + 9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gx + 3, GROUND_Y + 1); ctx.lineTo(gx + 8, GROUND_Y + 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gx + 6, GROUND_Y + 2); ctx.lineTo(gx + 10, GROUND_Y + 8); ctx.stroke();
      }

      if (state === 'play' || state === 'over') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(score, W/2, 48);
      }

      if (state === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 140, W, 180);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Courier New';
        ctx.fillText('CRASHED', W/2, 180);
        ctx.font = '14px Courier New';
        ctx.fillText('SCORE ' + score, W/2, 215);
        ctx.fillText('BEST ' + best, W/2, 235);
        ctx.font = '12px Courier New';
        ctx.fillText('CLICK OR SPACE TO TRY AGAIN', W/2, 270);
      }
    }

    // ==================== LOOP ====================
    function loop() {
      if (state === 'play' || state === 'over') update();
      draw();
      requestAnimationFrame(loop);
    }

    // ==================== INPUT ====================
    function flap() {
      if (state === 'play') {
        appa.vy = FLAP;
        flapAnim = 6;
        beep('flap');
      }
      if (state === 'over') {
        reset();
        state = 'play';
        appa.vy = FLAP * 0.6;
        flapAnim = 4;
        beep('flap');
      }
    }

    function handleClick(e) {
      if (e) e.preventDefault();
      flap();
    }

    // ==================== INIT ====================
    function init() {
      canvas = document.getElementById('game');
      ctx = canvas.getContext('2d');
      best = parseInt(localStorage.getItem('flappyAppaBest') || '0', 10);
      const bestEl = document.getElementById('best');
      if (bestEl) bestEl.querySelector('span').textContent = best;
      canvas.addEventListener('mousedown', handleClick);
      canvas.addEventListener('touchstart', handleClick, {passive: false});
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Space') {
          e.preventDefault();
          flap();
        }
        if (e.key.toLowerCase() === 'r' && state === 'over') {
          reset();
          state = 'play';
        }
      });
      console.log('%c[Flappy Appa] Ready. Click PLAY to start.', 'color:#0f0');
    }

    // ==================== START GAME FROM SPLASH ====================
    window.startGame = function() {
      const splash = document.getElementById('splash');
      const container = document.getElementById('game-container');
      if (!splash || !container) return;
      splash.style.display = 'none';
      container.style.display = 'block';
      reset();
      state = 'play';
      appa.vy = FLAP * 0.75;
      flapAnim = 4;
      if (pillars.length < 3) pillars.push({ x: 380, gapY: 175, passed: false });
      beep('flap');
      draw();
      loop();
    };

    window.addEventListener('keydown', function(e) {
      const splash = document.getElementById('splash');
      if (splash && splash.style.display !== 'none' &&
          (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Space')) {
        e.preventDefault();
        window.startGame();
      }
    }, { once: true });

    window.onload = init;
  </script>
</body>
