      patch("string", "      // Fireballs\n      for (let f of fireballs) f.x += f.vx;", "\n\n      // Waterbenders - level 4 only. They jump and launch broad water waves.\n      if (level === 4 && frame % 100 === 0 && waterbenders.length < 2 && Math.random() < 0.9) {\n        waterbenders.push({\n          x: W + 24,\n          baseY: GROUND_Y - 8,\n          phase: 0,\n          jumpH: 70 + Math.random() * 120,\n          shot: false,\n          cy: GROUND_Y - 8\n        });\n      }\n\n      for (let wb of waterbenders) {\n        wb.x -= SCROLL * 0.88;\n        if (wb.phase === 0 && wb.x < W * 0.78) wb.phase = 0.01;\n\n        if (wb.phase > 0) {\n          wb.phase += 0.035;\n          wb.cy = wb.baseY - Math.sin(Math.min(wb.phase, 1) * Math.PI) * wb.jumpH;\n\n          if (!wb.shot && wb.phase > 0.35 && wb.phase < 0.62) {\n            waterWaves.push({\n              x: wb.x - 8,\n              y: wb.cy - 6,\n              vx: -3.2,\n              phase: Math.random() * Math.PI * 2,\n              life: 120\n            });\n            wb.shot = true;\n            beep('water');\n          }\n\n          if (wb.phase > 1) wb.phase = 1;\n        }\n      }\n      waterbenders = waterbenders.filter(w => w.x > -50);\n\n      // Fireballs\n      for (let f of fireballs) f.x += f.vx;", "water update", null);
