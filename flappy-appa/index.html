<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Appa</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #1a1a1a; color: #fff; font-family: "Courier New", monospace; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div>LOADING FLAPPY APPA...</div>
  <script>
    (async () => {
      const files = [
        'game-html-00.b64', 'game-html-01.b64', 'game-html-02.b64', 'game-html-03.b64', 'game-html-04.b64',
        'game-html-05.b64', 'game-html-06.b64', 'game-html-07.b64', 'game-html-08.b64', 'game-html-09.b64'
      ];
      const parts = await Promise.all(files.map(file => fetch(file, { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error(file + ' ' + r.status);
        return r.text();
      })));
      let html = atob(parts.join('').replace(/\s+/g, ''));
      function patch(type, search, replacement, label, expectedCount) {
        const before = html;
        if (type === 'regex') html = html.replace(new RegExp(search), replacement);
        else if (type === 'regexAll') {
          const re = new RegExp(search, 'gm');
          const matches = html.match(re) || [];
          if (expectedCount !== null && matches.length !== expectedCount) throw new Error('Patch count failed: ' + label);
          html = html.replace(re, replacement);
        } else html = html.replace(search, replacement);
        if (html === before) throw new Error('Patch failed: ' + label);
      }
      patch("string", "AVOID THE ROCK SPIRES AND FIREBALLS", "AVOID THE ROCK SPIRES AND BENDERS", "splash text", null);
      patch("string", "<audio id=\"game-music\" src=\"music.m4a\" preload=\"auto\" loop playsinline></audio>", "<audio id=\"game-music\" preload=\"auto\" loop playsinline></audio>", "audio tag", null);
      patch("string", "const LEVEL_TARGETS = { 1: 20, 2: 20, 3: 25 };", "const LEVEL_TARGETS = { 1: 15, 2: 15, 3: 15, 4: 15 };", "targets", null);
      patch("string", "let level = 1;\n    let levelScore = 0;", "let level = 1;\n    let unlockedLevel = 1;\n    let levelScore = 0;", "checkpoint state", null);
      patch("string", "let fireballs = [];", "let fireballs = [];\n    let waterbenders = [];\n    let waterWaves = [];", "water state", null);
      patch("string", "const MUSIC_SRC = 'music.m4a';", "const LEVEL_MUSIC = {\n      1: 'https://opengameart.org/sites/default/files/Juhani%20Junkala%20-%20Epic%20Boss%20Battle%20%5BSeamlessly%20Looping%5D.wav',\n      2: 'https://opengameart.org/sites/default/files/Ireland%27s%20Coast_0.mp3',\n      3: 'https://opengameart.org/sites/default/files/Next%20to%20You.mp3',\n      4: 'https://opengameart.org/sites/default/files/Next%20to%20You.mp3'\n    };\n    const MUSIC_SRC = LEVEL_MUSIC[1];", "music map", null);
      patch("string", "      return gameMusic;\n    }", "      return gameMusic;\n    }\n\n    function getMusicSrc() {\n      return LEVEL_MUSIC[level] || LEVEL_MUSIC[1];\n    }", "getMusicSrc", null);
      patch("regex", "const music = getGameMusic\\(\\);\\s+if \\(restart\\) music\\.currentTime = 0;", "const music = getGameMusic();\n        const desiredSrc = getMusicSrc();\n        if (music.src !== desiredSrc) {\n          music.pause();\n          music.src = desiredSrc;\n          music.load();\n        }\n        if (restart) music.currentTime = 0;", "music switch", null);
      patch("string", "return LEVEL_TARGETS[level] || LEVEL_TARGETS[3];", "return LEVEL_TARGETS[level] || LEVEL_TARGETS[4];", "target fallback", null);
      patch("string", "function levelTarget() {\n      return LEVEL_TARGETS[level] || LEVEL_TARGETS[4];\n    }", "function levelTarget() {\n      return LEVEL_TARGETS[level] || LEVEL_TARGETS[4];\n    }\n\n    function clampLevel(value) {\n      return Math.max(1, Math.min(4, parseInt(value || 1, 10) || 1));\n    }\n\n    function loadCheckpoint() {\n      unlockedLevel = clampLevel(localStorage.getItem('flappyAppaUnlockedLevel') || 1);\n    }\n\n    function saveCheckpoint(nextLevel) {\n      unlockedLevel = Math.max(unlockedLevel, clampLevel(nextLevel));\n      localStorage.setItem('flappyAppaUnlockedLevel', unlockedLevel);\n    }\n\n    function checkpointScore(runLevel) {\n      let total = 0;\n      for (let i = 1; i < runLevel; i++) total += LEVEL_TARGETS[i] || 0;\n      return total;\n    }\n\n    function resetFromCheckpoint() {\n      reset(unlockedLevel, false);\n      score = checkpointScore(unlockedLevel);\n    }", "checkpoint helpers", null);
      patch("regexAll", "^      fireballs = \\[\\];$", "      fireballs = [];\n      waterbenders = [];\n      waterWaves = [];", "cleanup", 3);
      patch("string", "function finishLevel() {\n      state = 'levelclear';", "function finishLevel() {\n      saveCheckpoint(level + 1);\n      state = 'levelclear';", "save checkpoint on clear", null);
      patch("string", "best = parseInt(localStorage.getItem('flappyAppaBest') || '0', 10);", "best = parseInt(localStorage.getItem('flappyAppaBest') || '0', 10);\n      loadCheckpoint();", "load checkpoint", null);
      patch("regexAll", "reset\\(1, false\\);", "resetFromCheckpoint();", "restart from checkpoint", 4);
      patch("string", "if (level >= 3) {", "if (level >= 4) {", "win threshold", null);
      patch("string", "      // Fireballs\n      for (let f of fireballs) f.x += f.vx;", "\n\n      // Waterbenders - level 4 only. They jump and launch broad water waves.\n      if (level === 4 && frame % 100 === 0 && waterbenders.length < 2 && Math.random() < 0.9) {\n        waterbenders.push({\n          x: W + 24,\n          baseY: GROUND_Y - 8,\n          phase: 0,\n          jumpH: 70 + Math.random() * 120,\n          shot: false,\n          cy: GROUND_Y - 8\n        });\n      }\n\n      for (let wb of waterbenders) {\n        wb.x -= SCROLL * 0.88;\n        if (wb.phase === 0 && wb.x < W * 0.78) wb.phase = 0.01;\n\n        if (wb.phase > 0) {\n          wb.phase += 0.035;\n          wb.cy = wb.baseY - Math.sin(Math.min(wb.phase, 1) * Math.PI) * wb.jumpH;\n\n          if (!wb.shot && wb.phase > 0.35 && wb.phase < 0.62) {\n            waterWaves.push({\n              x: wb.x - 8,\n              y: wb.cy - 6,\n              vx: -3.2,\n              phase: Math.random() * Math.PI * 2,\n              life: 120\n            });\n            wb.shot = true;\n            beep('water');\n          }\n\n          if (wb.phase > 1) wb.phase = 1;\n        }\n      }\n      waterbenders = waterbenders.filter(w => w.x > -50);\n\n      // Fireballs\n      for (let f of fireballs) f.x += f.vx;", "water update", null);
      patch("string", "      fireballs = fireballs.filter(f => f.x > -20);", "      fireballs = fireballs.filter(f => f.x > -20);\n\n      // Water waves\n      for (let w of waterWaves) {\n        w.x += w.vx;\n        w.phase += 0.22;\n        w.life--;\n      }\n      waterWaves = waterWaves.filter(w => w.x > -60 && w.life > 0);", "wave update", null);
      patch("string", "      }\n    }\n\n    function die() {", "      }\n\n      // Water wave collision\n      for (let w of waterWaves) {\n        const dx = Math.abs(appa.x - w.x);\n        const waveY = w.y + Math.sin(w.phase) * 7;\n        const dy = Math.abs(appa.y - waveY);\n        if (dx < 28 && dy < 17) {\n          die();\n          return;\n        }\n      }\n    }\n\n    function die() {", "wave collision", null);
      patch("string", "\n\n      // Fireballs\n      for (let f of fireballs) {", "\n\n      // Waterbenders\n      for (let wb of waterbenders) {\n        const y = wb.cy || wb.baseY;\n        const armLift = wb.phase > 0.2 && wb.phase < 0.75;\n\n        ctx.fillStyle = '#1d74b8';\n        ctx.fillRect(wb.x - 5, y - 12, 12, 14);\n        ctx.fillStyle = '#0c3458';\n        ctx.fillRect(wb.x - 3, y - 20, 8, 8);\n        ctx.fillStyle = '#9ddcff';\n        ctx.fillRect(wb.x - 8, y - 15, 4, armLift ? 12 : 7);\n        ctx.fillRect(wb.x + 7, y - 15, 4, armLift ? 12 : 7);\n\n        ctx.strokeStyle = 'rgba(120, 210, 255, 0.75)';\n        ctx.lineWidth = 2;\n        ctx.beginPath();\n        ctx.arc(wb.x + 1, y - 8, 12 + Math.sin(frame * 0.16) * 2, -0.25, Math.PI * 1.25);\n        ctx.stroke();\n      }\n\n      // Fireballs\n      for (let f of fireballs) {", "water draw", null);
      patch("string", "      }\n\n      // Appa (sprite or simple vector)", "      }\n\n      // Water waves\n      for (let w of waterWaves) {\n        ctx.save();\n        ctx.translate(w.x, w.y);\n        ctx.strokeStyle = 'rgba(80, 190, 255, 0.9)';\n        ctx.lineWidth = 4;\n        ctx.beginPath();\n        ctx.moveTo(-25, Math.sin(w.phase - 0.8) * 6);\n        ctx.quadraticCurveTo(-12, -16 + Math.sin(w.phase) * 4, 0, Math.sin(w.phase + 0.7) * 6);\n        ctx.quadraticCurveTo(13, 16 + Math.sin(w.phase + 1.4) * 4, 27, Math.sin(w.phase + 2.1) * 6);\n        ctx.stroke();\n        ctx.strokeStyle = 'rgba(210, 245, 255, 0.85)';\n        ctx.lineWidth = 2;\n        ctx.beginPath();\n        ctx.moveTo(-20, Math.sin(w.phase) * 4 - 5);\n        ctx.quadraticCurveTo(-4, -15, 16, Math.sin(w.phase + 1) * 4 - 2);\n        ctx.stroke();\n        ctx.restore();\n      }\n\n      // Appa (sprite or simple vector)", "wave draw", null);
      patch("string", "if (level === 1) {\n          ctx.fillText('EARTHBENDERS AHEAD', W/2, 222);\n          ctx.fillText('WATCH THE GATES MOVE', W/2, 246);\n        } else {\n          ctx.fillText('AIRBENDERS AHEAD', W/2, 222);\n          ctx.fillText('DODGE THE AIR BALLS', W/2, 246);\n        }", "if (level === 1) {\n          ctx.fillText('EARTHBENDERS AHEAD', W/2, 222);\n          ctx.fillText('WATCH THE GATES MOVE', W/2, 246);\n        } else if (level === 2) {\n          ctx.fillText('AIRBENDERS AHEAD', W/2, 222);\n          ctx.fillText('DODGE THE AIR BALLS', W/2, 246);\n        } else {\n          ctx.fillText('WATERBENDERS AHEAD', W/2, 222);\n          ctx.fillText('DODGE THE WAVES', W/2, 246);\n        }", "overlay", null);
      patch("string", "AIRBENDER CELEBRATION", "FOUR LEVELS CLEARED", "win text", null);
      document.open();
      document.write(html);
      document.close();
    })().catch(err => {
      document.body.textContent = 'LOAD ERROR: ' + err.message;
    });
  </script>
</body>
</html>
