<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Appa</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #1a1a1a; color: #fff; font-family: "Courier New", monospace; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div>LOADING FLAPPY APPA...</div>
  <script>
    (async () => {
      const files = [
        'game-html-00.b64', 'game-html-01.b64', 'game-html-02.b64', 'game-html-03.b64', 'game-html-04.b64',
        'game-html-05.b64', 'game-html-06.b64', 'game-html-07.b64', 'game-html-08.b64', 'game-html-09.b64'
      ];
      const parts = await Promise.all(files.map(file => fetch(file, { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error(file + ' ' + r.status);
        return r.text();
      })));
      const html = atob(parts.join('').replace(/\s+/g, ''));
      document.open();
      document.write(html);
      document.close();
    })().catch(err => {
      document.body.textContent = 'LOAD ERROR: ' + err.message;
    });
  </script>
</body>
</html>
