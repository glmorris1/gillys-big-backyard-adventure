<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Appa</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", monospace;
      font-weight: bold;
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }
    .splash {
      text-align: center;
      background: #111;
      padding: 40px;
      border: 8px solid #333;
      border-radius: 8px;
      max-width: 380px;
      cursor: pointer;
    }
    .splash h1 {
      font-size: 42px;
      margin: 0 0 8px;
      text-shadow: 3px 3px 0 #000;
    }
    .splash .yip {
      font-size: 14px;
      color: #ffcc66;
      margin-bottom: 20px;
    }
    .splash button {
      background: #c33;
      color: #fff;
      border: 6px solid #111;
      font-size: 20px;
      padding: 12px 50px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      margin: 10px 0 20px;
      box-shadow: 0 6px 0 #111;
    }
    .splash button:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #111;
    }
    .container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 8px solid #111;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .info {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #888;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash" class="splash" onclick="startGame()">
    <h1>FLAPPY<br>APPA</h1>
    <div class="yip">YIP YIP!</div>
    
    <div style="font-size: 60px; margin: 10px 0;">🦬</div>
    
    <button onclick="event.stopImmediatePropagation(); startGame();">PLAY</button>
    
    <div style="font-size: 10px; line-height: 1.5; color: #aaa;">
      CLICK / TAP / SPACE TO FLAP<br>
      AVOID THE ROCK SPIRES AND FIREBALLS
    </div>
    
    <div id="best" style="margin-top: 18px; font-size: 11px; color: #666;">
      BEST: <span>0</span>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-container" class="container" style="display: none;">
    <canvas id="game" width="320" height="512"></canvas>
  </div>
  <audio id="game-music" src="music.m4a" preload="auto" loop playsinline></audio>

  <script>
    // ==================== CONFIG ====================
    const W = 320;
    const H = 512;
    const GRAVITY = 0.55;
    const FLAP = -8.2;
    const SCROLL = 1.7;
    const GROUND_Y = H - 70;

    // ==================== STATE ====================
    let canvas, ctx;
    let appa = { x: 70, y: 200, vy: 0, rot: 0 };
    let pillars = [];
    let firebenders = [];
    let earthbenders = [];
    let fireballs = [];
    let score = 0;
    let level = 1;
    let levelScore = 0;
    let levelClearTimer = 0;
    let screenShake = 0;
    let best = 0;
    let state = 'splash'; // splash, play, levelclear, over
    let frame = 0;
    let flapAnim = 0;

    let appaSprite = new Image();
    let spriteReady = false;

    // ==================== SPRITE ====================
    appaSprite.src = "appa.png";
    appaSprite.onload = () => { spriteReady = true; };
    appaSprite.onerror = () => { spriteReady = false; };

    // ==================== AUDIO ====================
    const MUSIC_SRC = 'music.m4a';
    let gameMusic;
    let synthAudioCtx;
    let synthTimer;
    let synthStep = 0;
    const synthMelody = [392, 440, 523, 440, 349, 392, 330, 294];

    function getGameMusic() {
      if (!gameMusic) {
        gameMusic = document.getElementById('game-music') || new Audio(MUSIC_SRC);
        gameMusic.loop = true;
        gameMusic.preload = 'auto';
        gameMusic.volume = 0.55;
        gameMusic.load();
        window.flappyAppaMusic = gameMusic;
      }
      return gameMusic;
    }

    function playGameMusic(restart = false) {
      try {
        const music = getGameMusic();
        if (restart) music.currentTime = 0;
        startFallbackMusic();
        music.play()
          .then(() => stopFallbackMusic())
          .catch(() => {});
      } catch(e){}
    }

    function stopGameMusic() {
      try {
        if (!gameMusic) return;
        gameMusic.pause();
        gameMusic.currentTime = 0;
        stopFallbackMusic();
      } catch(e){}
    }

    function startFallbackMusic() {
      try {
        if (synthTimer) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        synthAudioCtx = synthAudioCtx || new AudioCtx();
        if (synthAudioCtx.state === 'suspended') synthAudioCtx.resume();

        const playNote = () => {
          if (!synthAudioCtx) return;
          const now = synthAudioCtx.currentTime;
          const osc = synthAudioCtx.createOscillator();
          const gain = synthAudioCtx.createGain();
          const freq = synthMelody[synthStep % synthMelody.length];
          synthStep++;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.045, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
          osc.connect(gain);
          gain.connect(synthAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        };

        playNote();
        synthTimer = setInterval(playNote, 360);
      } catch(e){}
    }

    function stopFallbackMusic() {
      if (synthTimer) {
        clearInterval(synthTimer);
        synthTimer = null;
      }
    }

    function beep(type) {
      // Sound effects are intentionally muted so the background music stays clear.
    }

    // ==================== RESET ====================
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function makePillar(x, gapY) {
      return {
        x,
        gapY,
        targetGapY: gapY,
        passed: false,
        shifting: false
      };
    }

    function randomGapY() {
      return 90 + Math.random() * 220;
    }

    function seedPillars() {
      pillars.push(makePillar(280, level === 1 ? 160 : 175));
      pillars.push(makePillar(460, level === 1 ? 205 : 215));
    }

    function reset(runLevel = 1, keepScore = false) {
      level = runLevel;
      appa = { x: 70, y: 210, vy: 0, rot: 0 };
      pillars = [];
      firebenders = [];
      earthbenders = [];
      fireballs = [];
      if (!keepScore) score = 0;
      levelScore = 0;
      levelClearTimer = 0;
      screenShake = 0;
      frame = 0;
      flapAnim = 0;
      state = 'play';

      // initial pillars
      seedPillars();
    }

    function finishLevel() {
      state = 'levelclear';
      levelClearTimer = 95;
      firebenders = [];
      earthbenders = [];
      fireballs = [];
    }

    function startNextLevel() {
      reset(2, true);
      appa.vy = FLAP * 0.55;
      playGameMusic(false);
    }

    function triggerEarthShift(eb) {
      eb.triggered = true;
      eb.shake = 60;
      screenShake = Math.max(screenShake, 60);

      const candidates = pillars.filter(p => p.x > appa.x + 45);
      if (!candidates.length) return;
      const target = candidates.reduce((bestP, p) => p.x < bestP.x ? p : bestP, candidates[0]);
      const direction = Math.random() < 0.5 ? -1 : 1;
      const shift = 62 + Math.random() * 78;
      target.targetGapY = clamp(target.gapY + direction * shift, 80, 295);
      target.shifting = true;
    }

    // ==================== UPDATE ====================
    function update() {
      if (state === 'levelclear') {
        levelClearTimer--;
        if (levelClearTimer <= 0) startNextLevel();
        return;
      }
      if (state !== 'play') return;

      frame++;
      flapAnim = Math.max(0, flapAnim - 1);
      screenShake = Math.max(0, screenShake - 1);

      // Appa physics
      appa.vy += GRAVITY;
      appa.y += appa.vy;
      appa.rot = Math.max(-0.6, Math.min(1.3, appa.vy * 0.065));

      // Pillar scrolling + spawning
      for (let p of pillars) {
        p.x -= SCROLL;
        if (level === 2 && Math.abs(p.targetGapY - p.gapY) > 0.5) {
          p.gapY += (p.targetGapY - p.gapY) * 0.12;
        } else {
          p.gapY = p.targetGapY;
          p.shifting = false;
        }
      }

      if (pillars.length === 0 || pillars[pillars.length-1].x < 120) {
        pillars.push(makePillar(W + 30, randomGapY()));
      }
      pillars = pillars.filter(p => p.x > -60);

      // Score
      for (let p of pillars) {
        if (!p.passed && p.x + 40 < appa.x) {
          p.passed = true;
          score++;
          levelScore++;
          beep('score');
          if (level === 1 && levelScore >= 20) {
            finishLevel();
            return;
          }
        }
      }

      // Firebenders - intermittent, high random jumps, one fireball
      if (level === 1 && frame % 95 === 0 && firebenders.length < 2 && Math.random() < 0.85) {
        firebenders.push({
          x: W + 20,
          baseY: GROUND_Y - 8,
          phase: 0,
          jumpH: 80 + Math.random() * 300,   // can go very high, near top of screen
          shot: false
        });
      }

      for (let fb of firebenders) {
        fb.x -= SCROLL * 0.9;

        // start jump once when on screen
        if (fb.phase === 0 && fb.x < W * 0.75) {
          fb.phase = 0.01;
        }

        if (fb.phase > 0) {
          fb.phase += 0.038;
          const cy = fb.baseY - Math.sin(fb.phase * Math.PI) * fb.jumpH;

          // shoot exactly once near the top of the jump
          if (!fb.shot && fb.phase > 0.35 && fb.phase < 0.65) {
            fireballs.push({ x: fb.x + 10, y: cy - 10, vx: -3.6 });
            fb.shot = true;
            beep('fire');
          }

          fb.cy = cy;
          if (fb.phase > 1) fb.phase = 1; // stay on ground after jump
        }
      }
      firebenders = firebenders.filter(f => f.x > -50);

      // Earthbenders - level 2 only. They shake the screen and move the next gate.
      if (level === 2 && frame % 110 === 0 && earthbenders.length < 2 && Math.random() < 0.8) {
        earthbenders.push({
          x: W + 18,
          y: GROUND_Y - 8,
          triggered: false,
          shake: 0
        });
      }

      for (let eb of earthbenders) {
        eb.x -= SCROLL * 0.92;
        if (!eb.triggered && eb.x < W - 70) triggerEarthShift(eb);
        eb.shake = Math.max(0, eb.shake - 1);
      }
      earthbenders = earthbenders.filter(e => e.x > -45);

      // Fireballs
      for (let f of fireballs) f.x += f.vx;
      fireballs = fireballs.filter(f => f.x > -20);

      // Ground / ceiling death
      if (appa.y < 12 || appa.y > GROUND_Y - 8) {
        die();
        return;
      }

      // Pillar collision
      for (let p of pillars) {
        const inX = appa.x > p.x - 10 && appa.x < p.x + 50;
        if (inX && (appa.y < p.gapY - 8 || appa.y > p.gapY + 128 + 8)) {
          die();
          return;
        }
      }

      // Fireball collision
      for (let f of fireballs) {
        const dx = appa.x - f.x;
        const dy = appa.y - f.y;
        if (dx*dx + dy*dy < 220) {
          die();
          return;
        }
      }
    }

    function die() {
      if (state !== 'play') return;
      state = 'over';
      beep('hit');
      if (score > best) {
        best = score;
        localStorage.setItem('flappyAppaBest', best);
      }
    }

    // ==================== DRAW ====================
    function draw() {
      ctx.save();
      if (screenShake > 0) {
        const shake = screenShake > 42 ? 4 : 2;
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // Sky
      ctx.fillStyle = '#7fc4e8';
      ctx.fillRect(0, 0, W, H);

      // Far background mountains (darkest, slowest feel)
      ctx.fillStyle = '#3a5a3a';
      ctx.beginPath();
      ctx.moveTo(0, 310);
      ctx.lineTo(40, 240); ctx.lineTo(85, 290); ctx.lineTo(140, 235);
      ctx.lineTo(190, 295); ctx.lineTo(250, 225); ctx.lineTo(295, 280);
      ctx.lineTo(320, 240); ctx.lineTo(320, 340); ctx.lineTo(0, 340);
      ctx.fill();

      // Mid mountains
      ctx.fillStyle = '#5c7a5c';
      ctx.beginPath();
      ctx.moveTo(0, 300);
      ctx.lineTo(55, 215); ctx.lineTo(105, 265); ctx.lineTo(165, 195);
      ctx.lineTo(225, 270); ctx.lineTo(280, 205); ctx.lineTo(320, 255);
      ctx.lineTo(320, 320); ctx.lineTo(0, 320);
      ctx.fill();

      // Closer mountain layer with more jagged detail
      ctx.fillStyle = '#4a6a4a';
      ctx.beginPath();
      ctx.moveTo(0, 285);
      ctx.lineTo(35, 225); ctx.lineTo(78, 260); ctx.lineTo(115, 210);
      ctx.lineTo(155, 255); ctx.lineTo(195, 195); ctx.lineTo(235, 265);
      ctx.lineTo(275, 215); ctx.lineTo(310, 270); ctx.lineTo(320, 230);
      ctx.lineTo(320, 310); ctx.lineTo(0, 310);
      ctx.fill();

      // Detailed clouds (puffy, multiple layers for depth)
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      const cloudX = (frame * 0.4) % (W * 1.2);
      // Cloud 1
      ctx.beginPath(); ctx.arc(50 - cloudX * 0.3, 85, 14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(68 - cloudX * 0.3, 78, 18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(88 - cloudX * 0.3, 82, 13, 0, Math.PI*2); ctx.fill();
      // Cloud 2
      ctx.beginPath(); ctx.arc(170 - cloudX * 0.25, 110, 12, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(188 - cloudX * 0.25, 102, 17, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(208 - cloudX * 0.25, 108, 11, 0, Math.PI*2); ctx.fill();
      // Cloud 3 (higher, slower)
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(260 - cloudX * 0.15, 65, 10, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(275 - cloudX * 0.15, 60, 14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(292 - cloudX * 0.15, 64, 9, 0, Math.PI*2); ctx.fill();

      // Pillars (more detailed rock spires)
      for (let p of pillars) {
        const pw = 46;
        const px = p.x;

        // Top pillar (from top of screen down to gap)
        ctx.fillStyle = p.shifting ? '#6d6240' : '#5c4a3a';
        ctx.fillRect(px, 0, pw, p.gapY);

        // Layered rock texture for top
        ctx.fillStyle = '#4a3a2a';
        for (let i = 1; i < 6; i++) {
          const ly = (p.gapY / 6) * i;
          ctx.fillRect(px + 2, ly - 1, pw - 4, 3);
          if (i % 2 === 0) ctx.fillRect(px + 1, ly + 1, 3, 2);
        }

        // Jagged top cap
        ctx.fillStyle = '#3a2a22';
        ctx.beginPath();
        ctx.moveTo(px - 2, p.gapY);
        ctx.lineTo(px + 5, p.gapY - 14);
        ctx.lineTo(px + 15, p.gapY - 9);
        ctx.lineTo(px + 25, p.gapY - 16);
        ctx.lineTo(px + 35, p.gapY - 8);
        ctx.lineTo(px + pw + 3, p.gapY - 13);
        ctx.lineTo(px + pw + 2, p.gapY);
        ctx.closePath();
        ctx.fill();

        // Vertical cracks on top pillar
        ctx.strokeStyle = '#2a2218';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px + 9, 10);
        ctx.lineTo(px + 11, p.gapY - 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px + pw - 12, 15);
        ctx.lineTo(px + pw - 8, p.gapY - 10);
        ctx.stroke();

        // Bottom pillar
        const by = p.gapY + 128;
        ctx.fillStyle = p.shifting ? '#6d6240' : '#5c4a3a';
        ctx.fillRect(px, by, pw, H - by);

        // Layered rock texture for bottom
        ctx.fillStyle = '#4a3a2a';
        for (let i = 1; i < 5; i++) {
          const ly = by + ((H - by) / 5) * i;
          ctx.fillRect(px + 2, ly - 1, pw - 4, 3);
        }

        // Jagged bottom cap
        ctx.fillStyle = '#3a2a22';
        ctx.beginPath();
        ctx.moveTo(px - 2, by);
        ctx.lineTo(px + 4, by + 12);
        ctx.lineTo(px + 18, by + 8);
        ctx.lineTo(px + 28, by + 15);
        ctx.lineTo(px + 38, by + 7);
        ctx.lineTo(px + pw + 2, by + 11);
        ctx.lineTo(px + pw + 2, by);
        ctx.closePath();
        ctx.fill();

        // Vertical cracks on bottom pillar
        ctx.strokeStyle = '#2a2218';
        ctx.beginPath();
        ctx.moveTo(px + 10, by + 5);
        ctx.lineTo(px + 8, H - 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px + pw - 11, by + 10);
        ctx.lineTo(px + pw - 13, H - 5);
        ctx.stroke();

        if (p.shifting) {
          ctx.fillStyle = 'rgba(120, 210, 100, 0.32)';
          ctx.fillRect(px - 3, p.gapY, pw + 6, 128);
        }

        ctx.fillStyle = '#5c4a3a'; // reset
      }

      // Firebenders
      ctx.fillStyle = '#9c2a1f';
      for (let fb of firebenders) {
        const y = fb.cy || fb.baseY;
        // body
        ctx.fillRect(fb.x - 5, y - 12, 12, 14);
        // head
        ctx.fillStyle = '#222';
        ctx.fillRect(fb.x - 3, y - 20, 8, 8);
        ctx.fillStyle = '#9c2a1f';
        // arm up when jumping
        if (fb.phase > 0.2 && fb.phase < 0.8) {
          ctx.fillRect(fb.x + 6, y - 16, 3, 8);
        }
      }

      // Earthbenders
      for (let eb of earthbenders) {
        const y = eb.y;
        ctx.fillStyle = '#1f7a3a';
        ctx.fillRect(eb.x - 5, y - 12, 12, 14);
        ctx.fillStyle = '#203820';
        ctx.fillRect(eb.x - 3, y - 20, 8, 8);
        ctx.fillStyle = '#72c85a';
        ctx.fillRect(eb.x - 8, y - 15, 4, 8);
        ctx.fillRect(eb.x + 7, y - 15, 4, 8);

        if (eb.shake > 0) {
          ctx.strokeStyle = 'rgba(58, 120, 42, 0.8)';
          ctx.lineWidth = 2;
          const pulse = 10 + (60 - eb.shake) * 0.35;
          ctx.beginPath();
          ctx.arc(eb.x + 1, y - 10, pulse, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Fireballs
      for (let f of fireballs) {
        ctx.fillStyle = '#ff5500';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffee44';
        ctx.beginPath();
        ctx.arc(f.x - 1, f.y - 1, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Appa (sprite or simple vector)
      ctx.save();
      ctx.translate(appa.x, appa.y);
      ctx.rotate(appa.rot);

      if (spriteReady) {
        // Using your latest Appa.png (1536x1024). 
        // Scaled for the small canvas. Adjust sw/sh if you want it bigger or smaller on screen.
        // Centered so rotation during flight looks good.
        const sw = 64;
        const sh = 43;
        const cropBottom = Math.round(appaSprite.naturalHeight * 0.09);
        ctx.drawImage(
          appaSprite,
          0, 0, appaSprite.naturalWidth, appaSprite.naturalHeight - cropBottom,
          -sw/2, -sh/2, sw, sh
        );
      } else {
        // Improved vector fallback that closely matches the pixel sprite you provided
        // (cream body, brown patches, horns, head shape, legs, tail)
        ctx.fillStyle = '#f5f0e0';
        ctx.fillRect(-20, -6, 38, 18); // main body

        // Brown back patch (like in your sprite)
        ctx.fillStyle = '#8b6f47';
        ctx.fillRect(-12, -5, 20, 8);
        ctx.fillRect(-8, -10, 12, 5); // head top patch

        // Head
        ctx.fillStyle = '#f5f0e0';
        ctx.beginPath();
        ctx.arc(13, 0, 10, -0.3, Math.PI * 1.6);
        ctx.fill();

        // Horns (dark gray like the sprite)
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.moveTo(8, -8); ctx.lineTo(3, -14); ctx.lineTo(9, -9); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(17, -8); ctx.lineTo(22, -14); ctx.lineTo(17, -9); ctx.fill();

        // Eyes
        ctx.fillStyle = '#222';
        ctx.fillRect(8, -2, 3, 2);
        ctx.fillRect(15, -2, 3, 2);

        // Snout / face
        ctx.fillStyle = '#c5a37a';
        ctx.fillRect(20, -1, 6, 4);
        ctx.fillStyle = '#333';
        ctx.fillRect(24, 0, 2, 2); // nose

        // Legs (4 visible, dark hooves)
        ctx.fillStyle = '#8b6f47';
        ctx.fillRect(-14, 8, 5, 7);
        ctx.fillRect(-4, 8, 5, 7);
        ctx.fillRect(6, 8, 5, 7);
        ctx.fillRect(15, 8, 5, 7);

        ctx.fillStyle = '#333';
        ctx.fillRect(-14, 13, 5, 3);
        ctx.fillRect(-4, 13, 5, 3);
        ctx.fillRect(6, 13, 5, 3);
        ctx.fillRect(15, 13, 5, 3);

        // Tail
        ctx.fillStyle = '#f5f0e0';
        ctx.fillRect(-24, -2, 8, 8);
        ctx.fillStyle = '#8b6f47';
        ctx.fillRect(-26, 2, 4, 4); // tail tip
      }
      ctx.restore();

      // Ground - more detailed with parallax rocks and grass
      ctx.fillStyle = '#6b5a3a';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

      // Dirt layer
      ctx.fillStyle = '#4a3a22';
      ctx.fillRect(0, GROUND_Y + 8, W, 12);

      // Scrolling small rocks (parallax feel)
      ctx.fillStyle = '#3a2a1a';
      const rockOffset = (frame * 0.6) % 40;
      for (let i = 0; i < 9; i++) {
        const rx = (i * 42 - rockOffset) % (W + 50) - 20;
        ctx.fillRect(rx, GROUND_Y + 14 + (i % 3) * 3, 7 + (i % 3), 4);
        ctx.fillRect(rx + 18, GROUND_Y + 19, 4, 3);
      }

      // Grass top edge
      ctx.fillStyle = '#4a6a3a';
      ctx.fillRect(0, GROUND_Y, W, 8);

      // Grass tufts - more detailed
      ctx.strokeStyle = '#3a5a2a';
      ctx.lineWidth = 2;
      const grassOffset = (frame * 0.9) % 30;
      for (let i = -2; i < 14; i++) {
        const gx = (i * 28 - grassOffset) % (W + 40) - 15;
        // multiple blades per tuft
        ctx.beginPath();
        ctx.moveTo(gx, GROUND_Y + 2);
        ctx.lineTo(gx + 4, GROUND_Y + 9);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(gx + 3, GROUND_Y + 1);
        ctx.lineTo(gx + 8, GROUND_Y + 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(gx + 6, GROUND_Y + 2);
        ctx.lineTo(gx + 10, GROUND_Y + 8);
        ctx.stroke();
      }

      // Score
      if (state === 'play' || state === 'over') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(score, W/2, 48);

        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText('LEVEL ' + level, 10, 24);
        ctx.textAlign = 'right';
        const progress = level === 1 ? levelScore + '/20' : levelScore;
        ctx.fillText('GATES ' + progress, W - 10, 24);
      }

      // Level transition overlay
      if (state === 'levelclear') {
        ctx.fillStyle = 'rgba(0,0,0,0.58)';
        ctx.fillRect(0, 150, W, 160);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL 1 CLEARED', W/2, 190);
        ctx.font = '13px Courier New';
        ctx.fillText('EARTHBENDERS AHEAD', W/2, 222);
        ctx.fillText('WATCH THE GATES MOVE', W/2, 246);
      }

      // Game over overlay
      if (state === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 140, W, 180);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Courier New';
        ctx.fillText('CRASHED', W/2, 180);
        ctx.font = '14px Courier New';
        ctx.fillText('SCORE ' + score, W/2, 215);
        ctx.fillText('BEST ' + best, W/2, 235);
        ctx.font = '12px Courier New';
        ctx.fillText('CLICK OR SPACE TO TRY AGAIN', W/2, 270);
      }

      ctx.restore();
    }

    // ==================== LOOP ====================
    function loop() {
      if (state === 'play' || state === 'levelclear' || state === 'over') {
        update();
      }
      draw();
      requestAnimationFrame(loop);
    }

    // ==================== INPUT ====================
    function flap() {
      if (state === 'play') {
        appa.vy = FLAP;
        flapAnim = 6;
        if (gameMusic && gameMusic.paused) playGameMusic(false);
        beep('flap');
      }
      if (state === 'over') {
        reset(1, false);
        state = 'play';
        appa.vy = FLAP * 0.6;
        flapAnim = 4;
        playGameMusic(true);
        beep('flap');
      }
    }

    function handleClick(e) {
      if (e) e.preventDefault();
      flap();
    }

    // ==================== INIT ====================
    function init() {
      canvas = document.getElementById('game');
      ctx = canvas.getContext('2d');

      // load best
      best = parseInt(localStorage.getItem('flappyAppaBest') || '0', 10);
      const bestEl = document.getElementById('best');
      if (bestEl) bestEl.querySelector('span').textContent = best;

      // input
      canvas.addEventListener('mousedown', handleClick);
      canvas.addEventListener('touchstart', handleClick, {passive: false});
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Space') {
          e.preventDefault();
          flap();
        }
        if (e.key.toLowerCase() === 'r' && state === 'over') {
          reset(1, false);
          state = 'play';
          playGameMusic(true);
        }
      });

      // start on splash click (already wired via onclick on button + splash)
      // initial draw of splash is static
      console.log('%c[Flappy Appa] Ready. Click PLAY to start.', 'color:#0f0');
    }

    // ==================== START GAME FROM SPLASH ====================
    window.startGame = function() {
      const splash = document.getElementById('splash');
      const container = document.getElementById('game-container');

      if (!splash || !container) return;

      splash.style.display = 'none';
      container.style.display = 'block';

      reset(1, false);
      state = 'play';
      appa.vy = FLAP * 0.75;   // initial lift
      flapAnim = 4;
      playGameMusic(true);

      // seed a couple more pillars so it feels alive right away
      if (pillars.length < 3) {
        pillars.push(makePillar(380, 175));
      }

      beep('flap');
      draw();
      loop();
    };

    // Keyboard space also works on splash (before game starts)
    window.addEventListener('keydown', function(e) {
      const splash = document.getElementById('splash');
      if (splash && splash.style.display !== 'none' &&
          (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Space')) {
        e.preventDefault();
        window.startGame();
      }
    }, { once: true });

    // Boot
    window.onload = init;
  </script>
</body>
</html>
