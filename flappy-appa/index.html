<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Appa</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #1a1a1a; color: #fff; font-family: "Courier New", monospace; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div>LOADING FLAPPY APPA...</div>
  <script>
    (async () => {
      const files = [
        'game-html-00.b64', 'game-html-01.b64', 'game-html-02.b64', 'game-html-03.b64', 'game-html-04.b64',
        'game-html-05.b64', 'game-html-06.b64', 'game-html-07.b64', 'game-html-08.b64', 'game-html-09.b64'
      ];
      const parts = await Promise.all(files.map(file => fetch(file, { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error(file + ' ' + r.status);
        return r.text();
      })));
      let html = atob(parts.join('').replace(/\s+/g, ''));
      html = html
        .replace(
          /const MUSIC_SRC = 'music\.m4a';/,
          "const LEVEL_MUSIC = {\n      1: 'https://opengameart.org/sites/default/files/Juhani%20Junkala%20-%20Epic%20Boss%20Battle%20%5BSeamlessly%20Looping%5D.wav',\n      2: 'https://opengameart.org/sites/default/files/Ireland%27s%20Coast_0.mp3',\n      3: 'https://opengameart.org/sites/default/files/Next%20to%20You.mp3'\n    };\n    const MUSIC_SRC = LEVEL_MUSIC[1];\n\n    function getMusicSrc() {\n      return LEVEL_MUSIC[level] || LEVEL_MUSIC[1];\n    }"
        )
        .replace(
          /const music = getGameMusic\(\);\s+if \(restart\) music\.currentTime = 0;/,
          "const music = getGameMusic();\n        const desiredSrc = getMusicSrc();\n        if (music.src !== desiredSrc) {\n          music.pause();\n          music.src = desiredSrc;\n          music.load();\n        }\n        if (restart) music.currentTime = 0;"
        );
      document.open();
      document.write(html);
      document.close();
    })().catch(err => {
      document.body.textContent = 'LOAD ERROR: ' + err.message;
    });
  </script>
</body>
</html>
